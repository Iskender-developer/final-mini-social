<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Circle{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  {# Development setup: Tailwind Play CDN. For production, build Tailwind with its CLI (see README). #}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base { html { font-size: 15px; } }
    @layer components {
      .card { @apply rounded-xl border border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900; }
      .btn { @apply inline-flex h-11 items-center justify-center rounded-lg px-5 text-sm font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-zinc-950 disabled:cursor-not-allowed disabled:opacity-50; }
      .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
      .btn-outline { @apply border border-zinc-300 bg-white text-zinc-900 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:bg-zinc-800; }
      .btn-danger { @apply bg-red-700 text-white hover:bg-red-800; }
      .input { @apply w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-[15px] text-zinc-900 placeholder:text-zinc-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 aria-[invalid=true]:border-red-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100; }
      .nav-link { @apply flex h-11 items-center gap-3 rounded-lg px-3 text-[15px] font-medium text-zinc-700 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800; }
      .nav-link[aria-current="page"] { @apply bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300; }
      .muted { @apply text-zinc-600 dark:text-zinc-400; }
    }
  </style>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  {% if messages %}
    <div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4" role="status">
      {% for message in messages %}
        <div class="pointer-events-auto rounded-lg bg-zinc-900 px-4 py-2.5 text-sm font-medium text-white shadow-lg dark:bg-zinc-100 dark:text-zinc-900">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  {% block body %}{% block content %}{% endblock %}{% endblock %}

  <script>
    document.addEventListener('click', (e) => {
      const open = e.target.closest('[data-dialog]');
      if (open) {
        open.closest('details')?.removeAttribute('open');
        document.getElementById(open.dataset.dialog).showModal();
      }
      const close = e.target.closest('[data-close]');
      if (close) close.closest('dialog').close();
      document.querySelectorAll('details[data-menu][open]').forEach((d) => {
        if (!d.contains(e.target)) d.removeAttribute('open');
      });
    });
    setTimeout(() => document.querySelector('[role=status]')?.remove(), 3500);
  </script>
</body>
</html>
