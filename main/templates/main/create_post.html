{% extends 'app_base.html' %}
{% block title %}New post · Circle{% endblock %}

{% block content %}
<h1 class="mb-4 text-[22px] font-semibold tracking-tight">New post</h1>

<form method="post" enctype="multipart/form-data" class="card space-y-5 p-6">
  {% csrf_token %}
  {% include 'main/_field.html' with field=form.text %}
  {% include 'main/_field.html' with field=form.poster %}
  <p class="-mt-3 text-[13px] muted">JPG, PNG or WebP. Keep it under 5 MB.</p>

  <div id="preview-wrap" class="hidden">
    <img id="preview" alt="Selected image preview" class="max-h-80 w-full rounded-lg border border-zinc-200 object-cover dark:border-zinc-800">
  </div>

  <div class="flex justify-end gap-2">
    <a href="{% url 'home' %}" class="btn btn-outline">Cancel</a>
    <button id="post-btn" type="submit" class="btn btn-primary" disabled>Post</button>
  </div>
</form>

<script>
  const text = document.getElementById('{{ form.text.id_for_label }}');
  const file = document.getElementById('{{ form.poster.id_for_label }}');
  const btn = document.getElementById('post-btn');
  const wrap = document.getElementById('preview-wrap');
  const img = document.getElementById('preview');
  const sync = () => { btn.disabled = !text.value.trim(); };
  text.addEventListener('input', sync); sync();
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (f) { img.src = URL.createObjectURL(f); wrap.classList.remove('hidden'); }
    else { wrap.classList.add('hidden'); }
  });
</script>
{% endblock %}
